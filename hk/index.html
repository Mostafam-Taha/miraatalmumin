<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>E2EE Chat - Secure Communication</title>
    <link rel="stylesheet" href="style.css?v=2">
    <style>
        /* ===== Unread Badge & Last Message Preview ===== */
        .user-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .user-item-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            gap: 2px;
        }
        .conv-last-msg {
            font-size: 11px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
        }
        .unread-badge {
            background: #e74c3c;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            border-radius: 999px;
            min-width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            flex-shrink: 0;
            animation: badgePop 0.2s ease;
        }
        .unread-badge.hidden {
            display: none;
        }
        .user-item.has-unread .conv-username {
            font-weight: bold;
        }
        .user-item.has-unread .conv-last-msg {
            color: #ccc;
        }
        .user-item.active-chat {
            background: rgba(255,255,255,0.08);
            border-left: 2px solid #4CAF50;
        }
        @keyframes badgePop {
            0% { transform: scale(0.5); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <!-- Notification Toast -->
    <div id="notification" class="notification"></div>

    <!-- Auth Screen -->
    <div id="auth-screen">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <div class="auth-logo-icon">🔒</div>
                    <div class="auth-logo-text">E2EE CHAT</div>
                </div>
                <div class="auth-tagline">MILITARY-GRADE ENCRYPTION</div>
            </div>
            
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Login</button>
                <button class="auth-tab" data-tab="register">Register</button>
            </div>
            
            <!-- Login Panel -->
            <div id="login-panel" class="auth-panel">
                <div class="form-group">
                    <label>Username or Email</label>
                    <input type="text" id="login-username" placeholder="username@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="••••••••">
                </div>
                <div class="form-error" id="login-error"></div>
                <button class="btn-primary" id="login-btn">Authenticate</button>
            </div>
            
            <!-- Register Panel -->
            <div id="register-panel" class="auth-panel hidden">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="reg-username" placeholder="john_doe">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" placeholder="••••••••">
                </div>
                <div class="form-error" id="register-error"></div>
                <button class="btn-primary" id="register-btn">Create Account</button>
            </div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="hidden">
        <div class="topbar">
            <!-- زر القائمة للهواتف فقط -->
            <button id="mobile-menu-toggle" class="mobile-menu-btn">☰</button>

            <div class="topbar-logo">
                <span class="topbar-logo-icon">🔒</span>
                <span>E2EE CHAT</span>
            </div>
            <div class="topbar-spacer"></div>
            <div class="topbar-user">
                <span>🔐</span>
                <span><strong id="current-username">Loading...</strong></span>
                <div class="enc-badge">E2EE ACTIVE</div>
            </div>
            <button id="logout-btn">LOGOUT</button>
        </div>
        
        <div class="sidebar">
            <!-- زر إغلاق القائمة للهواتف فقط -->
            <div class="mobile-close-sidebar">
                <button id="mobile-close-sidebar" class="mobile-close-btn">✕</button>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-label">CONTACTS</div>
            </div>
            <div class="sidebar-scroll">
                <ul id="users-list" class="sidebar-list"></ul>
            </div>
        </div>
        
        <div class="chat-main">
            <div id="chat-placeholder" class="chat-placeholder">
                <div class="placeholder-icon">💬</div>
                <div class="placeholder-text">Select a contact to start secure conversation</div>
            </div>
            
            <div id="chat-active" class="hidden">
                <div class="chat-header">
                    <div class="chat-avatar">👤</div>
                    <div class="chat-header-info">
                        <div class="chat-peer-name" id="chat-peer-name">Select User</div>
                        <div class="chat-header-sub">END-TO-END ENCRYPTED</div>
                    </div>
                </div>
                
                <ul id="messages-list"></ul>
                
                <div class="chat-input-bar">
                    <input type="text" id="message-input" placeholder="Type secure message...">
                    <button id="attach-file-btn" class="icon-btn" title="Attach file">📎</button>
                    <input type="file" id="file-input" accept="image/*,video/*" style="display: none;">
                    <button id="send-message-btn" class="btn-send">SEND</button>
                </div>
            </div>
        </div>
    </div>
<!-- Overlay for mobile sidebar (يظهر خلف القائمة الجانبية) -->
<div id="mobile-overlay" class="mobile-overlay"></div>
    <script src="app.js?v=2"></script>
    <script src="crypto.js?v=2"></script>
</body>
</html>
